services:
  build:
    image: talispam-builder:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp /out/talispam /dist/talispam && chmod 755 /dist/talispam"]
    volumes:
      - ../dist:/dist

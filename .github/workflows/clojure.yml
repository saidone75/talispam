name: Clojure CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
    - name: Set up Clojure CLI
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        cli: '1.12.6.1673'
    - name: Install dependencies
      run: |
        clojure -P -M:test
        clojure -P -T:build
    - name: Run tests
      run: clojure -M:test
    - name: Smoke test from source
      run: clojure -M:run --help
    - name: Build uberjar
      run: clojure -T:build uber
    - name: Smoke test uberjar
      run: java -jar target/uberjar/talispam-*-standalone.jar --help

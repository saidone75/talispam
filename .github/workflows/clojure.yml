name: Clojure CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
    - name: Set up Leiningen
      uses: DeLaGuardo/setup-clojure@13.7
      with:
        lein: '2.12.0'
    - name: Install dependencies
      run: lein deps
    - name: Run tests
      run: lein test
